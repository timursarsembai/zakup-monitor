[project]
name = "zakup"
version = "0.1.0"
description = "Monitoring of goszakup.gov.kz announcements and lots"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "pypdf>=6.1.3,<7",
    "openpyxl>=3.1,<4",
    # Чужие .xlsx (импорт каталога продавца): openpyxl сам берёт defusedxml — без XML-бомб.
    "defusedxml>=0.7,<1",
    "cryptography>=42",
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zakup = "zakup.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zakup = ["migrations/*.sql", "templates/*.html", "templates/*/*.html", "static/*", "fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Ошибки, неиспользуемое, порядок импортов, частые недосмотры.
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
