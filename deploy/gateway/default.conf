# Шлюз перед двумя копиями сайта (web и web-2): при выкладке их перезапускают по
# очереди, а шлюз отправляет запросы в живую — сайт не пропадает. Адреса копий
# постоянные (сеть webnet в docker-compose.yml), поэтому DNS не нужен.
upstream zakup_web {
    server 172.31.96.11:8000 max_fails=1 fail_timeout=5s;
    server 172.31.96.12:8000 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 8000;
    server_tokens off;
    # Загрузок файлов на сайте нет: формы и вебхук — килобайты.
    client_max_body_size 1m;

    location / {
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
