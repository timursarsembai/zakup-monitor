# Шлюз перед двумя копиями сайта (web и web-2): при выкладке их перезапускают по
# очереди, а шлюз отправляет запросы в живую — сайт не пропадает. Адреса копий
# постоянные (сеть webnet в docker-compose.yml), поэтому DNS не нужен.
upstream zakup_web {
    server 172.31.96.11:8000 max_fails=1 fail_timeout=5s;
    server 172.31.96.12:8000 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

# Ограничение частоты по адресу клиента (его проставляет Nginx Proxy Manager): один
# робот или скрипт не займёт все соединения сайта с базой. Человеку и поисковику — с запасом.
limit_req_zone $http_x_real_ip zone=pages:10m rate=20r/s;
limit_req_zone $http_x_real_ip zone=heavy:10m rate=3r/s;
# Поиск с фильтрами — самые тяжёлые запросы к базе: строже, чтобы один адрес не занял пул.
limit_req_zone $http_x_real_ip zone=search:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8000;
    server_tokens off;
    # Формы и вебхук — килобайты; загрузка фото товаров — своё место ниже.
    client_max_body_size 1m;

    location / {
        limit_req zone=pages burst=60 nodelay;
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Поиск закупок и справочники организаций (с фильтрами).
    location ~ ^/(lots|announcements|orgs/[a-z]+)$ {
        limit_req zone=search burst=20 nodelay;
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Тяжёлое: картинки-превью рисуются, Excel собирается — реже.
    location ~ ^/(og/|export\.xlsx) {
        limit_req zone=heavy burst=10 nodelay;
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Фото товаров продавцов (zakup.photos): файлы с тома media — без сайта. Имя случайное
    # и не меняется — кэш надолго; только WebP, nosniff — браузер не примет за другое.
    # Без ограничения частоты: файлы с диска, а на странице каталога — до полусотни превью.
    location ~ "^/media/p/[0-9a-f]{2}/[0-9a-f]{32}(_t)?\.webp$" {
        root /srv;
        types { image/webp webp; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /media/ { return 404; }

    # Загрузка фото товара: запрос больше 1 МБ — только здесь и у импорта каталога — до 8 фото по 5 МБ.
    location ~ ^/my/shop/products/[0-9]+/photos$ {
        limit_req zone=heavy burst=10 nodelay;
        client_max_body_size 45m;
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Загрузка каталога из Excel/CSV (zakup.shop_import): файл до 5 МБ.
    location = /my/shop/import {
        limit_req zone=heavy burst=10 nodelay;
        client_max_body_size 6m;
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Вебхук оплаты — без ограничения (kazpayment повторяет при ошибке, но не стоит).
    location /webhooks/ {
        proxy_pass http://zakup_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента и схему проставил Nginx Proxy Manager — передаём как есть.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        # Копия перезапускается — повторяем запрос на другой. Для POST — только если
        # соединение не установилось (запрос точно не дошёл).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
