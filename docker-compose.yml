# Каждой службе — только её секреты: утечка из одной службы не раскрывает остальные.
x-db-env: &db-env
  # Приложение — под zakup_app (владелец таблиц, не суперпользователь): scripts/db-app-role.sh.
  DATABASE_URL: postgresql://zakup_app:${APP_DB_PASSWORD:?run scripts/db-app-role.sh}@postgres:5432/zakup
  # libpq показывает даты по времени Астаны.
  PGTZ: Asia/Almaty

# Уведомления в Telegram (оба бота: клиентские чаты — через клиентского).
x-telegram-env: &telegram-env
  ZAKUP_TELEGRAM_BOT_TOKEN: ${ZAKUP_TELEGRAM_BOT_TOKEN:-}
  ZAKUP_TELEGRAM_BOT_USERNAME: ${ZAKUP_TELEGRAM_BOT_USERNAME:-}
  ZAKUP_TELEGRAM_CHAT_ID: ${ZAKUP_TELEGRAM_CHAT_ID:-}
  ZAKUP_CLIENT_BOT_TOKEN: ${ZAKUP_CLIENT_BOT_TOKEN:-}

x-portal-env: &portal-env
  GOSZAKUP_TOKEN: ${GOSZAKUP_TOKEN:-}
  GOSZAKUP_REQUEST_DELAY: ${GOSZAKUP_REQUEST_DELAY:-0.5}

# Контейнерам приложения права root не нужны (работают от nobody).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zakup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zakup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zakup
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Под объём базы (~600 МБ) и память сервера (8 ГБ на несколько проектов): кэш 384 МБ,
    # сортировки в памяти, диск SSD, без JIT (на коротких запросах он только тормозит).
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - default_toast_compression=lz4
    shm_size: 256m
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakup"]
      interval: 10s
      retries: 6
    logging: *logging

  worker:
    <<: *hardening
    build: .
    image: zakup
    container_name: zakup-worker
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      # Быстрый круг — раз в 2 минуты: новые объявления, их подробности (без них не
      # работают фильтры), совпадения и рассылка. Тяжёлое — в сервисе archive.
      - zakup migrate; while true; do zakup sync; zakup rescan --days 3 --max-pages 4; zakup details --part open --limit 500; zakup payments; sleep 120; done
    environment:
      <<: [*db-env, *telegram-env, *portal-env]
      KAZPAYMENT_API_KEY: ${KAZPAYMENT_API_KEY:-}
    mem_limit: 256m
    logging: *logging

  # Медленный круг — раз в 15 минут: перечитать месяц (поздние публикации,
  # смена статусов), подробности завершённых и протоколы итогов.
  archive:
    <<: *hardening
    image: zakup
    container_name: zakup-archive
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["sh", "-c"]
    command:
      # Карточки организаций — первыми (не больше 300 за круг): долгие шаги ниже не должны
      # откладывать их при каждом перезапуске.
      - while true; do zakup subjects; zakup rescan; zakup details --part finished; zakup codes; zakup tidy; zakup seller-alerts; sleep 900; done
    environment:
      <<: [*db-env, *telegram-env, *portal-env]
    volumes:
      # tidy убирает файлы фото без строки в базе (zakup.photos.sweep).
      - media:/data/media
    mem_limit: 256m
    logging: *logging

  # Догрузка истории в прошлое (`zakup backfill-from ГГГГ-ММ-ДД` задаёт дату): своим
  # кругом, не мешая свежему сбору. Техспецификации старых лотов — только по запросу.
  history:
    <<: *hardening
    image: zakup
    container_name: zakup-history
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["sh", "-c"]
    command:
      - while true; do zakup backfill --max-pages 20; sleep 60; done
    environment:
      <<: [*db-env, *telegram-env, *portal-env]
    mem_limit: 256m
    logging: *logging

  # Заранее разбирает техспецификации открытых лотов в текст: страницы лотов
  # открываются без обращения к порталу.
  specs:
    <<: *hardening
    image: zakup
    container_name: zakup-specs
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "specs", "--loop"]
    environment: *db-env
    cpus: 0.5  # разбор PDF грузит процессор — не отнимать его у сайта и базы (сервер — 4 ядра на всё)
    mem_limit: 512m  # разбор PDF — в отдельном процессе, до ~200 МБ (zakup.spec)
    logging: *logging

  # Проценты обеспечения заявки и договора из документов открытых объявлений (zakup.securities).
  securities:
    <<: *hardening
    image: zakup
    container_name: zakup-securities
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "securities", "--loop"]
    environment: *db-env
    cpus: 0.5  # разбор PDF грузит процессор — не отнимать его у сайта и базы
    mem_limit: 512m  # разбор PDF — в отдельном процессе, до ~200 МБ
    logging: *logging

  # Оценки открытых лотов для фильтров поиска (zakup.scores, таблица lot_scores).
  scores:
    <<: *hardening
    image: zakup
    container_name: zakup-scores
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "scores", "--loop"]
    environment: *db-env
    mem_limit: 256m
    logging: *logging

  # Закупки Самрук-Казыны с единой платформы zakup.gov.kz (zakup.skk), проход раз в 10 минут.
  skk:
    <<: *hardening
    image: zakup
    container_name: zakup-skk
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "skk", "--loop"]
    environment: *db-env
    cpus: 0.5
    mem_limit: 256m
    logging: *logging

  # Резерв госзакупок с платформы zakup.gov.kz (zakup.reserve): свежие объявления раньше OWS и
  # пункты плана, которых нет в OWS. Проход раз в 2 минуты, запрос к платформе — раз в секунду.
  reserve:
    <<: *hardening
    image: zakup
    container_name: zakup-reserve
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "reserve", "--loop"]
    environment: *db-env
    cpus: 0.5
    mem_limit: 256m
    logging: *logging

  # Резерв лотов со страниц old.goszakup.gov.kz (zakup.oldportal), пока стоит список лотов OWS:
  # открытые объявления без лотов, запрос к порталу — раз в секунду.
  oldportal:
    <<: *hardening
    image: zakup
    container_name: zakup-oldportal
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "oldportal", "--loop"]
    environment: *db-env
    cpus: 0.5
    mem_limit: 256m
    logging: *logging

  # Поиск товаров под лоты через API OpenAI/Anthropic (ключи пользователей).
  # Claude Code по подписке работает не здесь, а на хосте: deploy/zakup-research.service.
  research:
    <<: *hardening
    image: zakup
    container_name: zakup-research
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "research", "--providers", "anthropic,openai"]
    environment:
      <<: [*db-env, *telegram-env]
      ZAKUP_SECRET_KEY: ${ZAKUP_SECRET_KEY:-}
    mem_limit: 256m
    logging: *logging

  bot:
    <<: *hardening
    image: zakup
    container_name: zakup-bot
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "bot"]
    environment:
      <<: [*db-env, *telegram-env]
    mem_limit: 128m
    logging: *logging

  client-bot:
    <<: *hardening
    image: zakup
    container_name: zakup-client-bot
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "client-bot"]
    environment:
      <<: [*db-env, *telegram-env]
    mem_limit: 128m
    logging: *logging

  # Сайт — две одинаковые копии за шлюзом (см. deploy/gateway/default.conf): выкладка
  # перезапускает их по очереди, и сайт не пропадает.
  web: &web
    <<: *hardening
    image: zakup
    container_name: zakup-web-1
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_started
    entrypoint:
      - uvicorn
      - zakup.web:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      # X-Forwarded-For принимаем только от шлюза (его адрес постоянный): иначе клиент
      # сам подставляет «свой» IP и обходит ограничение попыток входа.
      - --forwarded-allow-ips=172.31.96.10
    environment:
      <<: [*db-env, *telegram-env, *portal-env]
      ZAKUP_SECRET_KEY: ${ZAKUP_SECRET_KEY:-}
      KAZPAYMENT_API_KEY: ${KAZPAYMENT_API_KEY:-}
      KAZPAYMENT_WEBHOOK_SECRET: ${KAZPAYMENT_WEBHOOK_SECRET:-}
    volumes:
      # Фото товаров продавцов (zakup.photos): пишут обе копии сайта, раздаёт шлюз.
      - media:/data/media
    networks:
      default:
      webnet:
        ipv4_address: 172.31.96.11
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/robots.txt', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 5s
    mem_limit: 384m  # плюс разбор PDF по запросу (zakup.spec, отдельный процесс)
    logging: *logging

  web-2:
    <<: *web
    container_name: zakup-web-2
    networks:
      default:
      webnet:
        ipv4_address: 172.31.96.12

  # Шлюз: Nginx Proxy Manager ходит на zakup-web:8000, как и раньше.
  gateway:
    image: nginx:1.27-alpine
    container_name: zakup-web
    restart: unless-stopped
    volumes:
      # Папка, а не файл: при замене файла (git) контейнер видит новую версию.
      - ./deploy/gateway:/etc/nginx/conf.d:ro
      - media:/srv/media:ro
    ports:
      - "127.0.0.1:8096:8000"
    networks:
      proxy-network:
      webnet:
        ipv4_address: 172.31.96.10
    mem_limit: 64m
    logging: *logging

  # Тесты — на своей временной базе в сети без интернета: ни боевой базы, ни секретов
  # (scripts/test.sh). Код тестов может быть чужим — правки дежурного до одобрения.
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: zakup
      POSTGRES_PASSWORD: zakup
      POSTGRES_DB: zakup_test
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - testnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakup"]
      interval: 1s
      retries: 30
    mem_limit: 256m
    logging: *logging

  tests:
    build: .
    image: zakup-test
    profiles: ["test"]
    depends_on:
      postgres-test:
        condition: service_healthy
    entrypoint: ["pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      TEST_DATABASE_URL: postgresql://zakup:zakup@postgres-test:5432/zakup_test
      DATABASE_URL: postgresql://zakup:zakup@postgres-test:5432/zakup_test
      PGTZ: Asia/Almaty
    networks:
      - testnet
    mem_limit: 768m
    logging: *logging

volumes:
  pgdata:
  # Фото товаров (docs/CATALOG_PLAN.md, этап 4) — в ночной копии сервера (~/backups/make-backup.sh).
  media:

networks:
  proxy-network:
    external: true
  testnet:
    internal: true
  webnet:
    ipam:
      config:
        - subnet: 172.31.96.0/24
