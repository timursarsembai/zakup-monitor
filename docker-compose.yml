x-app-env: &app-env
  DATABASE_URL: postgresql://zakup:${POSTGRES_PASSWORD}@postgres:5432/zakup
  # libpq показывает даты по времени Астаны.
  PGTZ: Asia/Almaty
  GOSZAKUP_TOKEN: ${GOSZAKUP_TOKEN:-}
  GOSZAKUP_REQUEST_DELAY: ${GOSZAKUP_REQUEST_DELAY:-0.5}
  ZAKUP_TELEGRAM_BOT_TOKEN: ${ZAKUP_TELEGRAM_BOT_TOKEN:-}
  ZAKUP_TELEGRAM_BOT_USERNAME: ${ZAKUP_TELEGRAM_BOT_USERNAME:-}
  ZAKUP_TELEGRAM_CHAT_ID: ${ZAKUP_TELEGRAM_CHAT_ID:-}
  ZAKUP_SECRET_KEY: ${ZAKUP_SECRET_KEY:-}
  ZAKUP_CLIENT_BOT_TOKEN: ${ZAKUP_CLIENT_BOT_TOKEN:-}
  KAZPAYMENT_API_KEY: ${KAZPAYMENT_API_KEY:-}
  KAZPAYMENT_WEBHOOK_SECRET: ${KAZPAYMENT_WEBHOOK_SECRET:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zakup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zakup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zakup
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakup"]
      interval: 10s
      retries: 6
    logging: *logging

  worker:
    build: .
    image: zakup
    container_name: zakup-worker
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      # Быстрый круг — раз в 2 минуты: новые объявления, их подробности (без них не
      # работают фильтры), совпадения и рассылка. Тяжёлое — в сервисе archive.
      - zakup migrate; while true; do zakup sync; zakup rescan --days 3 --max-pages 4; zakup details --part open --limit 500; zakup payments; sleep 120; done
    environment: *app-env
    mem_limit: 256m
    logging: *logging

  # Медленный круг — раз в 15 минут: перечитать месяц (поздние публикации,
  # смена статусов), подробности завершённых и протоколы итогов.
  archive:
    image: zakup
    container_name: zakup-archive
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["sh", "-c"]
    command:
      - while true; do zakup rescan; zakup details --part finished; zakup subjects; sleep 900; done
    environment: *app-env
    mem_limit: 256m
    logging: *logging

  # Заранее разбирает техспецификации открытых лотов в текст: страницы лотов
  # открываются без обращения к порталу.
  specs:
    image: zakup
    container_name: zakup-specs
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "specs", "--loop"]
    environment: *app-env
    mem_limit: 256m
    logging: *logging

  # Поиск товаров под лоты через API OpenAI/Anthropic (ключи пользователей).
  # Claude Code по подписке работает не здесь, а на хосте: deploy/zakup-research.service.
  research:
    image: zakup
    container_name: zakup-research
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "research", "--providers", "anthropic,openai"]
    environment: *app-env
    mem_limit: 256m
    logging: *logging

  bot:
    image: zakup
    container_name: zakup-bot
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "bot"]
    environment: *app-env
    mem_limit: 128m
    logging: *logging

  client-bot:
    image: zakup
    container_name: zakup-client-bot
    restart: unless-stopped
    init: true
    depends_on:
      worker:
        condition: service_started
    entrypoint: ["zakup", "client-bot"]
    environment: *app-env
    mem_limit: 128m
    logging: *logging

  web:
    image: zakup
    container_name: zakup-web
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_started
    # Порт снаружи не открыт: сюда ходят только NPM и localhost, поэтому
    # X-Forwarded-For можно верить от любого адреса — по нему считаются попытки входа.
    entrypoint:
      - uvicorn
      - zakup.web:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      # Доверяем X-Forwarded-For только от прокси (сеть NPM): иначе клиент сам
      # подставляет «свой» IP и обходит ограничение попыток входа.
      - --forwarded-allow-ips=172.18.0.0/16
    environment: *app-env
    ports:
      - "127.0.0.1:8096:8000"
    # proxy-network — сеть Nginx Proxy Manager: он ходит на zakup-web:8000.
    networks:
      - default
      - proxy-network
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:

networks:
  proxy-network:
    external: true
