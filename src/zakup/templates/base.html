<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Закупки{% endblock %} · zakup</title>
<script>
  // Тема: по умолчанию тёмная, выбор запоминается в браузере. До отрисовки, чтобы не мигало.
  (function () {
    var theme = "dark", zoom = 1, contrast = "";
    try {
      theme = localStorage.getItem("zakup-theme") || "dark";
      zoom = parseFloat(localStorage.getItem("zakup-zoom")) || 1;
      contrast = localStorage.getItem("zakup-contrast") || "";
    } catch (e) {}
    var root = document.documentElement;
    root.dataset.theme = theme;
    // Режим для слабовидящих: масштаб всей страницы и высокий контраст.
    if (zoom !== 1) root.style.zoom = zoom;
    if (contrast) root.dataset.contrast = contrast;
  })();
</script>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e4e7; --accent: #0b6bcb; --ok: #137a43; --bad: #c0392b; color-scheme: light; }
  :root[data-theme=dark] { --bg: #151517; --fg: #ececee; --muted: #9a9aa0; --line: #2c2c30; --accent: #5aa7ff; --ok: #6fdc9f; --bad: #ff7b6b; color-scheme: dark; }
  :root[data-contrast=high] { --bg: #fff; --fg: #000; --muted: #1d1d1f; --line: #000; --accent: #0033cc; --ok: #005a1e; --bad: #a00000; }
  :root[data-contrast=high][data-theme=dark] { --bg: #000; --fg: #fff; --muted: #f2f2f2; --line: #fff; --accent: #ffd400; --ok: #7dffb0; --bad: #ff8a80; }
  :root[data-contrast=high] a { text-decoration: underline; }
  :root[data-contrast=high] .primary, :root[data-contrast=high] .filter-open,
  :root[data-contrast=high] .scope-tabs a.on { color: var(--bg) !important; }
  :root[data-contrast=high] .main-nav a, :root[data-contrast=high] .icon-button { text-decoration: none; }
  :root[data-contrast=high] :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  header, main { max-width: 1600px; margin: 0 auto; padding: 12px 24px; }
  header { display: flex; gap: 18px; align-items: center; border-bottom: 1px solid var(--line); }
  header b { font-size: 17px; }
  .main-nav { display: flex; gap: 22px; }
  .main-nav a { display: inline-flex; align-items: center; gap: 6px; }
  .main-nav a.on { color: var(--fg); font-weight: 600; }
  .main-nav svg, .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-button { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; color: inherit; }
  .icon-button.on { border-color: var(--accent); color: var(--accent); }
  .theme-toggle, .a11y-toggle { padding: 4px 9px; font-size: 16px; line-height: 1; }
  .a11y { position: relative; }
  .a11y-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 260px; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / 20%); }
  .a11y-panel[hidden] { display: none; }
  .a11y-panel b { display: block; margin-bottom: 8px; }
  .a11y-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .a11y-row output { min-width: 48px; text-align: center; font-weight: 600; }
  .a11y-row button { min-width: 40px; font-size: 18px; }
  a { color: var(--accent); text-decoration: none; }
  form.filters, form.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  input[type=text], input:not([type]) { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 13px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  form.logout { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  @media (max-width: 760px) {
    header, main { padding: 10px 12px; }
    header { gap: 8px 12px; }
    /* На телефоне разделы — нижняя панель: иконка и подпись, в одну строку. */
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    .main-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; gap: 0; justify-content: space-around; background: var(--bg); border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
    .main-nav a { flex: 1; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); padding: 2px 0; text-align: center; }
    .main-nav a.on { color: var(--accent); font-weight: 600; }
    .main-nav svg { width: 24px; height: 24px; }
    header { flex-wrap: nowrap; }
    header .logout { gap: 6px; }
    .a11y-panel { position: fixed; left: 12px; right: 12px; top: 56px; width: auto; }
    header .who { display: none; }
    .table-wrap table { min-width: 760px; }
  }
  {% block style %}{% endblock %}
</style>
</head>
<body>
{% block header %}
<header>
  <b>zakup</b>
  {% set path = request.url.path %}
  <nav class="main-nav" aria-label="Разделы">
    <a href="/lots" class="{{ 'on' if path in ('/lots', '/announcements') or path.startswith('/lots/') or path.startswith('/a/') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Закупки</span></a>
    <a href="/my" class="{{ 'on' if path == '/my' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Мои лоты</span></a>
    <a href="/subscriptions" class="{{ 'on' if path == '/subscriptions' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span>Подписки</span></a>
    <a href="/matches" class="{{ 'on' if path == '/matches' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span>Совпадения</span></a>
  </nav>
  <form class="logout" method="post" action="/logout">
    <span class="muted who">{{ request.state.email }}</span>
    <span class="a11y">
      <button type="button" class="a11y-toggle" data-a11y-toggle title="Режим для слабовидящих" aria-label="Режим для слабовидящих" aria-expanded="false">Aa</button>
      <div class="a11y-panel" data-a11y-panel hidden>
        <b>Для слабовидящих</b>
        <div class="a11y-row">Размер
          <button type="button" data-zoom="-0.1" aria-label="Мельче">−</button>
          <output data-zoom-value>100%</output>
          <button type="button" data-zoom="0.1" aria-label="Крупнее">+</button>
        </div>
        <label class="a11y-row"><input type="checkbox" data-contrast> Высокий контраст</label>
        <button type="button" data-a11y-reset>Как было</button>
      </div>
    </span>
    <button type="button" class="theme-toggle" data-theme-toggle title="Светлая / тёмная тема" aria-label="Переключить тему"></button>
    <a href="/settings" class="icon-button {{ 'on' if path == '/settings' }}" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
    <button>Выйти</button>
  </form>
</header>
{% endblock %}
<main{% block main_class %}{% endblock %}>{% block main %}{% endblock %}</main>
<script>
  (() => {
    const root = document.documentElement;
    const panel = document.querySelector("[data-a11y-panel]");
    const toggle = document.querySelector("[data-a11y-toggle]");
    if (!panel) return;
    const store = (key, value) => { try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch (e) {} };
    const zoomNow = () => parseFloat(root.style.zoom) || 1;
    const show = () => {
      panel.querySelector("[data-zoom-value]").textContent = Math.round(zoomNow() * 100) + "%";
      panel.querySelector("[data-contrast]").checked = root.dataset.contrast === "high";
    };
    const setZoom = (value) => {
      const zoom = Math.min(2, Math.max(1, Math.round(value * 10) / 10));
      root.style.zoom = zoom === 1 ? "" : zoom;
      store("zakup-zoom", zoom === 1 ? "" : String(zoom));
      show();
    };
    toggle.addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      toggle.setAttribute("aria-expanded", String(!panel.hidden));
      show();
    });
    document.addEventListener("click", (event) => {
      if (!panel.hidden && !event.target.closest(".a11y")) { panel.hidden = true; toggle.setAttribute("aria-expanded", "false"); }
    });
    for (const button of panel.querySelectorAll("[data-zoom]")) {
      button.addEventListener("click", () => setZoom(zoomNow() + parseFloat(button.dataset.zoom)));
    }
    panel.querySelector("[data-contrast]").addEventListener("change", (event) => {
      if (event.target.checked) root.dataset.contrast = "high"; else delete root.dataset.contrast;
      store("zakup-contrast", event.target.checked ? "high" : "");
    });
    panel.querySelector("[data-a11y-reset]").addEventListener("click", () => {
      delete root.dataset.contrast; store("zakup-contrast", "");
      setZoom(1);
    });
  })();
  for (const button of document.querySelectorAll("[data-theme-toggle]")) {
    const show = () => { button.textContent = document.documentElement.dataset.theme === "dark" ? "☀" : "☾"; };
    button.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("zakup-theme", next); } catch (e) {}
      show();
    });
    show();
  }
</script>
</body>
</html>
