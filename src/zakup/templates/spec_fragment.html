{% if text %}<div class="spec-text">{{ text }}</div>{% else %}<p class="muted">{{ error }} <button type="button" data-spec-retry>{{ _("Обновить") }}</button></p>{% endif %}
{% if url %}<p><a href="{{ url | safe_url }}" target="_blank" rel="noopener">{{ _("Скачать PDF спецификации") }}</a></p>{% endif %}
