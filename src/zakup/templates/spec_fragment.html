{% if text %}<div class="summary-box" data-summary data-src="/lots/{{ lot_id }}/spec-summary"><button type="button" class="summary-btn" data-summary-start>📋 {{ _("Кратко: главное в таблице (ИИ)") }}</button></div>
<details class="spec-full" open><summary>{{ _("Полный текст") }}</summary><div class="spec-text">{{ text }}</div></details>{% else %}<p class="muted">{{ error }} <button type="button" data-spec-retry>{{ _("Обновить") }}</button></p>{% endif %}
{% if url %}<p><a href="{{ url | safe_url }}" target="_blank" rel="noopener">{{ _("Скачать PDF спецификации") }}</a></p>{% endif %}
