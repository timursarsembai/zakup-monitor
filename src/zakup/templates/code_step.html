{% extends "_auth.html" %}
{% block auth_title %}{{ title }}{% endblock %}
{% block card %}
<form class="card" method="post" action="{{ action }}">
  <h1>{{ title }}</h1>
  <p class="hint">{{ _("Код отправлен по SMS на номер") }} <b>{{ phone }}</b>.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="flow" value="{{ flow }}">
  <div class="field">
    <label for="code">{{ _("Код из SMS") }}</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required autofocus>
  </div>
  <div class="field">
    <label for="password">{{ _("Новый пароль") if reset else _("Придумайте пароль") }} <span class="muted">{{ _("— не короче 10 знаков") }}</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
  </div>
  <div class="field">
    <label for="password2">{{ _("Повторите пароль") }}</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="10" required>
  </div>
  <button class="submit">{{ _("Сохранить пароль") if reset else _("Зарегистрироваться") }}</button>
</form>
{% endblock %}
{% block foot %}<a href="{{ again }}">{{ _("Не пришёл код? Отправить заново") }}</a>{% endblock %}
